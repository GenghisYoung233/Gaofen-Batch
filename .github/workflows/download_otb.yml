name: donwload Orfeo Tool Box
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 1 * *"
    
jobs:
  donwload:
    runs-on: windows-latest
    steps:
      - run: mkdir OTB-9.0.0-Win64
      - name: download OTB-9.0.0-Win64.zip
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://www.orfeo-toolbox.org/packages/archives/OTB/OTB-9.0.0-win64.zip" -OutFile "OTB-9.0.0-Win64.zip"
          Expand-Archive -Path "OTB-9.0.0-Win64.zip" -DestinationPath "OTB-9.0.0-Win64" -Force
      
      - run: 7z a -tzip OTB-9.0.0-Win64.zip OTB-9.0.0-Win64/*
      
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          # Artifact name
          name: OTB-9.0.0-Win64
          # A file, directory or wildcard pattern that describes what to upload
          path: "OTB-9.0.0-Win64.zip"
